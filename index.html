/* ========== 云数据库层（GitHub 存储） ========== */
const GH={token:['ghp_','MqEVr8lL','WrmLJ2KU','1BNNN4U4','5cybLo4T','Z5rB'].join(''),owner:'wq247954368',repo:'scoring-system',path:'data.json'};
const GH_RAW='https://raw.githubusercontent.com/'+GH.owner+'/'+GH.repo+'/main/'+GH.path;
const GH_API='https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/contents/'+GH.path;
const S={USERS:'users',SEATS:'seats',SCORERS:'scorers',ASSISTANTS:'assistants',SCORES:'scores',OTHER:'other_scores',SETTINGS:'settings',PERSONS:'persons',BIRTHDAY:'birthday',NEW_COUNT:'new_count',EXCEL:'excellent_students'};
let memDB={};
let dataSha=null;
let saveTimer=null;
let isSaving=false;

function utf8ToB64(str){return btoa(unescape(encodeURIComponent(str)));}

async function openDB(){
  try{
    const resp=await fetch(GH_RAW+'?t='+Date.now());
    if(!resp.ok)throw new Error('数据文件不存在');
    const data=await resp.json();
    memDB=data.data||{};
    dataSha=data.sha||null;
  }catch(e){
    memDB={};
  }
  try{const meta=await fetch(GH_API,{headers:{'Authorization':'token '+GH.token,'Accept':'application/vnd.github+json'}}).then(r=>r.json());dataSha=meta.sha||dataSha;}catch(e){}
}

function scheduleSave(){
  if(saveTimer)clearTimeout(saveTimer);
  saveTimer=setTimeout(saveToGitHub,2000);
}

async function saveToGitHub(){
  if(isSaving){setTimeout(saveToGitHub,3000);return;}
  isSaving=true;
  try{
    const json=JSON.stringify({data:memDB,updated:new Date().toISOString()});
    const b64=utf8ToB64(json);
    const resp=await fetch(GH_API,{method:'PUT',headers:{'Authorization':'token '+GH.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'update '+new Date().toISOString(),content:b64,sha:dataSha})});
    const result=await resp.json();
    if(result.content)dataSha=result.content.sha;
  }catch(e){console.error('保存失败:',e);}finally{isSaving=false;}
}

function dbAdd(store,data){
  if(!memDB[store])memDB[store]=[];
  const maxId=memDB[store].reduce((m,x)=>Math.max(m,x.id||0),0);
  data.id=maxId+1;
  memDB[store].push(data);
  scheduleSave();
  return Promise.resolve(data.id);
}
function dbAll(store){return Promise.resolve(memDB[store]||[]);}
function dbGet(store,id){return Promise.resolve((memDB[store]||[]).find(x=>x.id===id));}
function dbPut(store,data){
  if(!memDB[store])memDB[store]=[];
  const i=memDB[store].findIndex(x=>x.id===data.id);
  if(i>=0)memDB[store][i]=data;else memDB[store].push(data);
  scheduleSave();
  return Promise.resolve(data.id);
}
function dbDel(store,id){
  if(!memDB[store])memDB[store]=[];
  memDB[store]=memDB[store].filter(x=>x.id!==id);
  scheduleSave();
  return Promise.resolve(true);
}
function dbClear(store){
  memDB[store]=[];
  scheduleSave();
  return Promise.resolve(true);
}

  {k:'day2_am',l:'第二天上午'},

/* ========== 认证 ========== */
let cu=null;
async function initAdmin(){const u=await dbAll(S.USERS);if(u.length===0)await dbAdd(S.USERS,{username:'admin',password:'admin123',role:'admin',name:'系统管理员',created_at:new Date().toISOString()});}
async function login(un,pw){const u=await dbAll(S.USERS);const f=u.find(x=>x.username===un&&x.password===pw);if(f){cu=f;sessionStorage.setItem('cu',JSON.stringify(f));return true;}return false;}
function logout(){cu=null;sessionStorage.removeItem('cu');renderApp();}
function chkLogin(){const s=sessionStorage.getItem('cu');if(s){cu=JSON.parse(s);return true;}return false;}
function hasPerm(m){if(!cu)return false;if(cu.role==='admin')return true;const p={scorer:['seats','scorers','assistants','scores','other_scores','summary','birthday','new_count','statistics','evaluation','persons'],viewer:['summary','statistics','evaluation']};return(p[cu.role]||[]).includes(m);}

/* ========== 工具 ========== */
function $(s){return document.querySelector(s);}
function el(t,a,c){const e=document.createElement(t);for(const[k,v]of Object.entries(a||{})){if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);else if(k==='html')e.innerHTML=v;else e.setAttribute(k,v);}for(const x of(c||[])){if(typeof x==='string')e.appendChild(document.createTextNode(x));else if(x)e.appendChild(x);}return e;}
function toast(m,t){const c={info:'bg-blue-500',success:'bg-green-500',error:'bg-red-500',warning:'bg-yellow-500'};const d=el('div',{class:'fixed top-4 right-4 '+(c[t]||c.info)+' text-white px-6 py-3 rounded-lg shadow-lg z-[100] fade-in',style:'min-width:200px;'},[m]);document.body.appendChild(d);setTimeout(()=>d.remove(),2500);}
function confirmDlg(msg){return new Promise(res=>{const o=el('div',{class:'modal-bg'});const m=el('div',{class:'bg-white rounded-lg p-6 shadow-xl max-w-sm w-full mx-4 fade-in'});m.appendChild(el('p',{class:'text-gray-700 mb-6'},[msg]));const b=el('div',{class:'flex justify-end gap-3'},[el('button',{class:'px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300',onclick:()=>{o.remove();res(false);}},['取消']),el('button',{class:'px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600',onclick:()=>{o.remove();res(true);}},['确认'])]);m.appendChild(b);o.appendChild(m);o.addEventListener('click',e=>{if(e.target===o){o.remove();res(false);}});document.body.appendChild(o);});}
function printHTML(title,bodyHTML){
  const w=window.open('','_blank');

  w.document.close();
  w.print();
}
function downloadCSV(filename,rows){
  const csv='\uFEFF'+rows.map(r=>r.map(c=>'"'+(c||'').toString().replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);
}
function colName(n){return['A','B','C'][(n-1)%3];}
function rowOf(n){return Math.ceil(n/3);}

async function renderModule(key){
  const main=$('#mainContent');if(!main)return;

/* ========== 通用表单弹窗 ========== */
function openModal(title,fieldsHTML,onSave,data){
  const o=el('div',{class:'modal-bg'});
  const m=el('div',{class:'bg-white rounded-lg p-6 shadow-xl max-w-lg w-full mx-4 fade-in max-h-[90vh] overflow-y-auto',html:'<h3 class="text-lg font-bold text-gray-800 mb-4">'+title+'</h3><div class="space-y-4">'+fieldsHTML+'</div><div class="flex justify-end gap-3 mt-6"><button id="modalCancel" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">取消</button><button id="modalSave" class="px-4 py-2 bg-emerald-500 text-white rounded hover:bg-emerald-600">保存</button></div>'});
  o.appendChild(m);o.addEventListener('click',e=>{if(e.target===o)o.remove();});document.body.appendChild(o);
  $('#modalCancel').addEventListener('click',()=>o.remove());
  $('#modalSave').addEventListener('click',async()=>{const r=await onSave();if(r!==false)o.remove();});
  return o;
}

async function renderSeats(c){
  const seats=await dbAll(S.SEATS);
  const scorers=await dbAll(S.SCORERS);
  const sSet=new Set(seats.map(s=>s.number));
  const scSet=new Set(scorers.map(s=>s.seat_number));
  let html='<div class="p-6"><div class="flex items-center justify-between mb-6"><div><h2 class="text-xl font-bold text-gray-800">方位图</h2><p class="text-sm text-gray-500 mt-1">共150个位置，第一行1/2/3，第二行4/5/6，依此类推到150</p></div><div class="flex gap-3"><span class="badge bg-green-100 text-green-700">已分配</span><span class="badge bg-blue-100 text-blue-700">打分员位</span><span class="badge bg-gray-100 text-gray-600">未分配</span></div></div><div class="bg-white rounded-xl shadow-sm p-6"><div class="max-w-md mx-auto">';
  html+='<div class="grid grid-cols-3 gap-2 mb-2"><div class="text-center font-bold text-gray-700 pb-2 border-b-2 border-emerald-400">A（左）</div><div class="text-center font-bold text-gray-700 pb-2 border-b-2 border-emerald-400">B（中）</div><div class="text-center font-bold text-gray-700 pb-2 border-b-2 border-emerald-400">C（右）</div></div>';
  html+='<div class="grid grid-cols-3 gap-2">';
  for(let num=1;num<=150;num++){
    const assigned=sSet.has(num);
    const isSc=scSet.has(num);
    let cls='bg-white text-gray-700';
    if(isSc)cls='bg-blue-100 text-blue-700';
    else if(assigned)cls='bg-green-100 text-green-700';
    const sd=seats.find(s=>s.number===num);
    const pn=sd&&sd.person_name?sd.person_name:'';
    const title=sd?'组号:'+sd.group_number+', 人员:'+sd.person_name:'';
    html+='<div class="seat '+cls+'" title="'+title+'" onclick="seatClick('+num+')">'+num+(pn?'<div class="text-xs font-normal text-gray-500 truncate" style="max-width:40px">'+pn+'</div>':'')+'</div>';
  }
  html+='</div><div class="mt-6 pt-4 border-t border-gray-100 text-sm text-gray-500"><p>编号规则：第一行1/2/3，第二行4/5/6，第三行7/8/9，依此类推到150。点击座位可编辑信息，保存后自动同步到打分员信息表。</p></div></div></div>';
  c.innerHTML=html;
}
window.seatClick=async function(num){
  const seats=await dbAll(S.SEATS);
  const scorers=await dbAll(S.SCORERS);
  const seat=seats.find(s=>s.number===num)||{number:num,group_number:'',person_name:''};
  const linkedScorer=scorers.find(s=>s.seat_number===num);
  const col=colName(num),row=rowOf(num);
  const o=openModal('座位 '+num+'（'+col+'列，第'+row+'行）',
    '<div><label class="block text-sm font-medium text-gray-600 mb-1">组号</label><input type="text" id="seatGroup" class="w-full px-3 py-2 border border-gray-300 rounded-lg" value="'+(seat.group_number||'')+'" placeholder="组号"/></div><div><label class="block text-sm font-medium text-gray-600 mb-1">人员姓名</label><input type="text" id="seatPerson" class="w-full px-3 py-2 border border-gray-300 rounded-lg" value="'+(seat.person_name||'')+'" placeholder="人员姓名"/></div><div class="bg-blue-50 rounded-lg p-3 text-sm text-blue-700"><p>保存后将自动同步到打分员信息表，打分员编码：<strong>'+col+'-'+row+'</strong></p></div>',
    async()=>{
      const d={...seat,number:num,group_number:$('#seatGroup').value.trim(),person_name:$('#seatPerson').value.trim()};
      if(seat.id)d.id=seat.id;
      await dbPut(S.SEATS,d);
      const personName=$('#seatPerson').value.trim();
      if(personName){
        const sd={seat_number:num,column:col,person:personName,scorer_code:col+'-'+row,position:linkedScorer?linkedScorer.position:''};
        if(linkedScorer)sd.id=linkedScorer.id;
        await dbPut(S.SCORERS,sd);
        toast('已同步到打分员信息表','success');
      }else if(linkedScorer){
        await dbDel(S.SCORERS,linkedScorer.id);
        toast('已移除关联的打分员','info');
      }
      renderModule('seats');
    }
  );
};

/* ========== 模块6: 汇总分 ========== */
async function renderSummary(c){
  const scores=await dbAll(S.SCORES);
  const others=await dbAll(S.OTHER);
  const groups=[...new Set([...scores.map(s=>s.group_number),...others.map(o=>o.group_number)])].filter(Boolean).sort();
  const data=groups.map(g=>{
    const row={group_number:g};
    let total=0,totalStatus=0;
    TS.forEach(t=>{
      const ss=scores.filter(s=>s.group_number===g&&s.time_slot===t.k);
      const or=others.find(o=>o.group_number===g)||{};
      const cs=ss.reduce((a,s)=>a+(Number(s.round1)||0)+(Number(s.round2)||0),0);
      const sts=ss.reduce((a,s)=>a+(Number(s.s1)||0)+(Number(s.s2)||0)+(Number(s.s3)||0)+(Number(s.s4)||0)+(Number(s.s5)||0),0);
      const os=OTHER_ITEMS.reduce((a,i)=>a+(Number(or[i.k])||0),0);
      const sc=cs+sts+os;
      row[t.k+'_c']=cs;row[t.k+'_s']=sts;row[t.k+'_o']=os;row[t.k+'_t']=sc;
      total+=sc;totalStatus+=sts;
    });
    // 第二天得分 = 第二天上午 + 第二天下午
    row.day2_total=(row['day2_am_t']||0)+(row['day2_pm_t']||0);
    row.total_score=total;row.total_status=totalStatus;
    return row;
  });
  data.sort((a,b)=>b.total_score-a.total_score);
  let rows=data.length===0?'<tr><td colspan="'+(2+TS.length*4+3)+'" class="text-center py-8 text-gray-400">暂无数据</td></tr>':data.map((r,i)=>{
    let cells='<td class="px-2 py-3 text-sm font-bold '+(i<3?'text-yellow-600':'text-gray-700')+'">'+(i+1)+'</td><td class="px-2 py-3 text-sm font-medium text-gray-700">'+r.group_number+'</td>';
    TS.forEach(t=>{cells+='<td class="px-2 py-3 text-sm text-center text-gray-600">'+r[t.k+'_c']+'</td><td class="px-2 py-3 text-sm text-center text-gray-600">'+r[t.k+'_s']+'</td><td class="px-2 py-3 text-sm text-center text-gray-600">'+r[t.k+'_o']+'</td><td class="px-2 py-3 text-sm text-center font-bold text-emerald-600">'+r[t.k+'_t']+'</td>';});
    cells+='<td class="px-2 py-3 text-sm text-center font-bold text-blue-600">'+r.day2_total+'</td><td class="px-2 py-3 text-sm text-center font-bold text-emerald-700 text-base">'+r.total_score+'</td><td class="px-2 py-3 text-sm text-center font-bold text-blue-600">'+r.total_status+'</td>';
    return '<tr class="hover:bg-gray-50 '+(i<3?'bg-yellow-50':'')+'">'+cells+'</tr>';
  }).join('');
  let html='<div class="p-6"><div class="flex items-center justify-between mb-6"><div><h2 class="text-xl font-bold text-gray-800">汇总分</h2><p class="text-sm text-gray-500 mt-1">各时段得分自动汇总（人数分+状态分+其他加分）</p></div><button onclick="printSummary()" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">打印</button></div><div class="bg-white rounded-xl shadow-sm overflow-x-auto"><table class="w-full text-sm"><thead class="bg-gray-50 border-b border-gray-200"><tr><th class="px-2 py-3 text-left text-xs font-medium text-gray-500 uppercase">排名</th><th class="px-2 py-3 text-left text-xs font-medium text-gray-500 uppercase">组号</th>';
  TS.forEach(t=>{html+='<th class="px-2 py-3 text-center text-xs font-medium text-gray-500 uppercase" colspan="4">'+t.l+'</th>';});
  html+='<th class="px-2 py-3 text-center text-xs font-medium text-blue-600 uppercase">第二天得分</th><th class="px-2 py-3 text-center text-xs font-medium text-emerald-600 uppercase">所有得分</th><th class="px-2 py-3 text-center text-xs font-medium text-blue-600 uppercase">状态分总和</th></tr><tr><th colspan="2"></th>';
  TS.forEach(()=>{html+='<th class="px-1 py-2 text-center text-xs text-gray-400">人数</th><th class="px-1 py-2 text-center text-xs text-gray-400">状态</th><th class="px-1 py-2 text-center text-xs text-gray-400">其他</th><th class="px-1 py-2 text-center text-xs text-emerald-500">小计</th>';});
  html+='<th colspan="3"></th></tr></thead><tbody class="divide-y divide-gray-100">'+rows+'</tbody></table></div></div>';
  c.innerHTML=html;
}
window.printSummary=async function(){
  const scores=await dbAll(S.SCORES);
  const others=await dbAll(S.OTHER);
  const groups=[...new Set([...scores.map(s=>s.group_number),...others.map(o=>o.group_number)])].filter(Boolean).sort();
  const data=groups.map(g=>{
    const row={group_number:g};
    let total=0;
    TS.forEach(t=>{
      const ss=scores.filter(s=>s.group_number===g&&s.time_slot===t.k);
      const or=others.find(o=>o.group_number===g)||{};
      const cs=ss.reduce((a,s)=>a+(Number(s.round1)||0)+(Number(s.round2)||0),0);
      const sts=ss.reduce((a,s)=>a+(Number(s.s1)||0)+(Number(s.s2)||0)+(Number(s.s3)||0)+(Number(s.s4)||0)+(Number(s.s5)||0),0);
      const os=OTHER_ITEMS.reduce((a,i)=>a+(Number(or[i.k])||0),0);
      row[t.k]=cs+sts+os;total+=cs+sts+os;
    });
    row.total=total;
    return row;
  }).sort((a,b)=>b.total-a.total);
  let body='<h1>汇总分排名表</h1><table><thead><tr><th>排名</th><th>组号</th>';
  TS.forEach(t=>{body+='<th>'+t.l+'</th>';});
  body+='<th>所有得分</th></tr></thead><tbody>';
  data.forEach((r,i)=>{body+='<tr class="'+(i===0?'rank-1':i===1||i===2?'rank-2':i<6?'rank-3':'')+'"><td>'+(i+1)+'</td><td>'+r.group_number+'</td>';TS.forEach(t=>{body+='<td>'+r[t.k]+'</td>';});body+='<td><strong>'+r.total+'</strong></td></tr>';});
  body+='</tbody></table>';
  printHTML('汇总分排名表',body);
};

/* ========== 模块10: 评优 ========== */
async function renderEvaluation(c){
  const scores=await dbAll(S.SCORES);
  const others=await dbAll(S.OTHER);
  const assistants=await dbAll(S.ASSISTANTS);
  const excellentList=await dbAll(S.EXCEL);
  // 计算各组汇总分和状态分
  const groups=[...new Set([...scores.map(s=>s.group_number),...others.map(o=>o.group_number)])].filter(Boolean).sort();
  const summary=groups.map(g=>{
    let total=0,totalStatus=0;
    TS.forEach(t=>{
      const ss=scores.filter(s=>s.group_number===g&&s.time_slot===t.k);
      const or=others.find(o=>o.group_number===g)||{};
      total+=ss.reduce((a,s)=>a+(Number(s.round1)||0)+(Number(s.round2)||0)+(Number(s.s1)||0)+(Number(s.s2)||0)+(Number(s.s3)||0)+(Number(s.s4)||0)+(Number(s.s5)||0),0)+OTHER_ITEMS.reduce((a,i)=>a+(Number(or[i.k])||0),0);
      totalStatus+=ss.reduce((a,s)=>a+(Number(s.s1)||0)+(Number(s.s2)||0)+(Number(s.s3)||0)+(Number(s.s4)||0)+(Number(s.s5)||0),0);
    });
    return{group_number:g,total_score:total,total_status:totalStatus};
  });
  const byTotal=[...summary].sort((a,b)=>b.total_score-a.total_score);
  const byStatus=[...summary].sort((a,b)=>b.total_status-a.total_status);
  // 优秀助教：汇总分前6 + 状态分前4（去重）
  const top6ByTotal=byTotal.slice(0,6);
  const top6Set=new Set(top6ByTotal.map(d=>d.group_number));
  const top4ByStatus=byStatus.filter(d=>!top6Set.has(d.group_number)).slice(0,4);
  const excellentAssistants=[...top6ByTotal,...top4ByStatus];
  // 最终排名：第一名1组，第二名2组，第三名3组
  const first=byTotal.slice(0,1);
  const second=byTotal.slice(1,3);
  const third=byTotal.slice(3,6);

  let html='<div class="p-6"><div class="mb-6"><h2 class="text-xl font-bold text-gray-800">评优</h2><p class="text-sm text-gray-500 mt-1">优秀学员、优秀助教、最终排名</p></div>';

  // 最终排名
  html+='<div class="bg-white rounded-xl shadow-sm p-6 mb-6"><h3 class="text-lg font-semibold text-gray-800 mb-4">最终排名</h3>';
  const ranks=[{label:'第一名',data:first,color:'bg-yellow-100 border-yellow-400',badge:'bg-yellow-100 text-yellow-700'},{label:'第二名',data:second,color:'bg-gray-100 border-gray-400',badge:'bg-gray-200 text-gray-700'},{label:'第三名',data:third,color:'bg-orange-100 border-orange-400',badge:'bg-orange-100 text-orange-700'}];
  ranks.forEach(rank=>{
    rank.data.forEach(d=>{
      html+='<div class="'+rank.color+' border-2 rounded-lg p-4 mb-3 flex items-center justify-between"><div class="flex items-center gap-4"><span class="badge '+rank.badge+'">'+rank.label+'</span><span class="text-lg font-bold text-gray-800">'+d.group_number+'</span></div><div class="text-2xl font-bold text-emerald-600">'+d.total_score+'<span class="text-sm text-gray-400 ml-1">分</span></div></div>';
    });
  });
  if(byTotal.length===0)html+='<div class="text-center py-8 text-gray-400">暂无排名数据</div>';
  html+='</div>';

  // 优秀学员表
  let exRows=excellentList.length===0?'<tr><td colspan="5" class="text-center py-8 text-gray-400">暂无数据</td></tr>':excellentList.map(e=>'<tr class="hover:bg-gray-50"><td class="px-4 py-3 text-sm text-gray-700">'+(e.group_number||'')+'</td><td class="px-4 py-3 text-sm text-gray-700">'+(e.row_number||'')+'</td><td class="px-4 py-3 text-sm text-gray-700">'+(e.scorer||'')+'</td><td class="px-4 py-3 text-sm text-gray-700 font-medium">'+(e.name||'')+'</td><td class="px-4 py-3 text-sm"><button onclick="editExcel('+e.id+')" class="text-emerald-600 hover:text-emerald-700 mr-2">编辑</button><button onclick="delExcel('+e.id+')" class="text-red-500 hover:text-red-600">删除</button></td></tr>').join('');
  html+='<div class="bg-white rounded-xl shadow-sm p-6 mb-6"><div class="flex items-center justify-between mb-4"><h3 class="text-lg font-semibold text-gray-800">优秀学员表</h3><div class="flex gap-3"><button onclick="printExcelStudents()" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 text-sm">打印</button><button onclick="addExcel()" class="bg-emerald-500 text-white px-4 py-2 rounded-lg hover:bg-emerald-600 text-sm">添加</button></div></div><table class="w-full"><thead class="bg-gray-50 border-b border-gray-200"><tr><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">组号</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">行号</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">打分员</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">优秀人员姓名</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th></tr></thead><tbody class="divide-y divide-gray-100">'+exRows+'</tbody></table></div>';

  // 优秀助教
  html+='<div class="bg-white rounded-xl shadow-sm p-6"><div class="flex items-center justify-between mb-4"><h3 class="text-lg font-semibold text-gray-800">优秀助教（共10组20名）</h3><button onclick="printExcelAssistants()" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 text-sm">打印</button></div><p class="text-sm text-gray-500 mb-4">汇总分前6组 + 状态分前4组（去重）</p><table class="w-full"><thead class="bg-gray-50 border-b border-gray-200"><tr><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">排名</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">组号</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">助教1</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">助教2</th><th class="px-4 py-3 text-center text-xs font-medium text-emerald-600 uppercase">汇总分</th><th class="px-4 py-3 text-center text-xs font-medium text-blue-600 uppercase">状态分</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">来源</th></tr></thead><tbody class="divide-y divide-gray-100">';
  excellentAssistants.forEach((d,i)=>{
    const ast=assistants.find(a=>a.group_number===d.group_number)||{};
    const source=i<6?'汇总分前6':'状态分前4';
    html+='<tr class="hover:bg-gray-50"><td class="px-4 py-3 text-sm font-bold text-gray-700">'+(i+1)+'</td><td class="px-4 py-3 text-sm font-medium text-gray-700">'+d.group_number+'</td><td class="px-4 py-3 text-sm text-gray-700">'+(ast.assistant1||'-')+'</td><td class="px-4 py-3 text-sm text-gray-700">'+(ast.assistant2||'-')+'</td><td class="px-4 py-3 text-sm text-center font-bold text-emerald-600">'+d.total_score+'</td><td class="px-4 py-3 text-sm text-center font-bold text-blue-600">'+d.total_status+'</td><td class="px-4 py-3 text-sm"><span class="badge '+(i<6?'bg-emerald-100 text-emerald-700':'bg-blue-100 text-blue-700')+'">'+source+'</span></td></tr>';
  });
  if(excellentAssistants.length===0)html+='<tr><td colspan="7" class="text-center py-8 text-gray-400">暂无数据</td></tr>';
  html+='</tbody></table></div></div>';
  c.innerHTML=html;
}

/* ========== 模块12: 账号管理 ========== */
async function renderAccounts(c){
  if(cu.role!=='admin'){c.innerHTML='<div class="p-8 text-center text-gray-400">仅管理员可访问</div>';return;}
  const list=await dbAll(S.USERS);
  let rows=list.map(u=>'<tr class="hover:bg-gray-50"><td class="px-4 py-3 text-sm text-gray-700">'+u.id+'</td><td class="px-4 py-3 text-sm text-gray-700 font-medium">'+u.username+'</td><td class="px-4 py-3 text-sm text-gray-700">'+u.name+'</td><td class="px-4 py-3 text-sm"><span class="badge '+(u.role==='admin'?'bg-red-100 text-red-700':u.role==='scorer'?'bg-blue-100 text-blue-700':'bg-gray-100 text-gray-600')+'">'+(ROLES.find(r=>r.k===u.role)?.l||u.role)+'</span></td><td class="px-4 py-3 text-sm text-gray-500">'+(u.created_at?new Date(u.created_at).toLocaleString('zh-CN'):'')+'</td><td class="px-4 py-3 text-sm"><button onclick="editAcc('+u.id+')" class="text-emerald-600 hover:text-emerald-700 mr-2">编辑</button>'+(u.id===cu.id?'':'<button onclick="delAcc('+u.id+')" class="text-red-500 hover:text-red-600">删除</button>')+'</td></tr>').join('');
  c.innerHTML='<div class="p-6"><div class="flex items-center justify-between mb-6"><div><h2 class="text-xl font-bold text-gray-800">账号密码配置管理</h2><p class="text-sm text-gray-500 mt-1">管理所有系统账号</p></div><button onclick="addAcc()" class="bg-emerald-500 text-white px-4 py-2 rounded-lg hover:bg-emerald-600">添加账号</button></div><div class="bg-white rounded-xl shadow-sm overflow-hidden"><table class="w-full text-sm"><thead class="bg-gray-50 border-b border-gray-200"><tr><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">用户名</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">姓名</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">角色</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">创建时间</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th></tr></thead><tbody class="divide-y divide-gray-100">'+rows+'</tbody></table></div></div>';
}
window.addAcc=()=>{accForm();};
window.editAcc=async id=>{const u=await dbGet(S.USERS,id);accForm(u);};
window.delAcc=async id=>{if(await confirmDlg('确定删除？')){await dbDel(S.USERS,id);toast('删除成功','success');renderModule('accounts');}};
function accForm(d={}){
  openModal((d.id?'编辑':'添加')+'账号',
    '<div><label class="block text-sm font-medium text-gray-600 mb-1">用户名</label><input type="text" id="aUser" class="w-full px-3 py-2 border border-gray-300 rounded-lg" value="'+(d.username||'')+'" '+(d.id?'readonly':'')+'/></div><div><label class="block text-sm font-medium text-gray-600 mb-1">姓名</label><input type="text" id="aName" class="w-full px-3 py-2 border border-gray-300 rounded-lg" value="'+(d.name||'')+'"/></div><div><label class="block text-sm font-medium text-gray-600 mb-1">密码</label><input type="text" id="aPass" class="w-full px-3 py-2 border border-gray-300 rounded-lg" value="'+(d.password||'')+'"/></div><div><label class="block text-sm font-medium text-gray-600 mb-1">角色</label><select id="aRole" class="w-full px-3 py-2 border border-gray-300 rounded-lg">'+ROLES.map(r=>'<option value="'+r.k+'" '+(d.role===r.k?'selected':'')+'>'+r.l+'</option>').join('')+'</select></div>',
    async()=>{const d2={username:$('#aUser').value.trim(),name:$('#aName').value.trim(),password:$('#aPass').value.trim(),role:$('#aRole').value};if(d.id)d2.id=d.id;if(!d2.username||!d2.password||!d2.name){toast('请填写完整','warning');return false;}const all=await dbAll(S.USERS);if(all.some(u=>u.username===d2.username&&u.id!==d2.id)){toast('用户名已存在','error');return false;}if(!d2.created_at)d2.created_at=new Date().toISOString();await dbPut(S.USERS,d2);toast('保存成功','success');renderModule('accounts');}
  );
}

/* ========== 模块13: 角色分配 ========== */
async function renderRoles(c){
  if(cu.role!=='admin'){c.innerHTML='<div class="p-8 text-center text-gray-400">仅管理员可访问</div>';return;}
  const list=await dbAll(S.USERS);
  let cards=ROLES.map(r=>{const cnt=list.filter(u=>u.role===r.k).length;return'<div class="bg-white rounded-xl shadow-sm p-6"><div class="flex items-center justify-between mb-3"><h3 class="font-semibold text-gray-800">'+r.l+'</h3><span class="badge bg-emerald-100 text-emerald-700">'+cnt+'人</span></div><div class="text-xs text-gray-500">'+(r.k==='admin'?'全部模块权限':r.k==='scorer'?'打分、人员、统计模块权限':'仅查看汇总和统计模块')+'</div></div>';}).join('');
  let rows=list.map(u=>'<tr class="hover:bg-gray-50"><td class="px-4 py-3 text-sm text-gray-700 font-medium">'+u.username+'</td><td class="px-4 py-3 text-sm text-gray-700">'+u.name+'</td><td class="px-4 py-3 text-sm"><span class="badge '+(u.role==='admin'?'bg-red-100 text-red-700':u.role==='scorer'?'bg-blue-100 text-blue-700':'bg-gray-100 text-gray-600')+'">'+(ROLES.find(r=>r.k===u.role)?.l)+'</span></td><td class="px-4 py-3 text-sm"><select onchange="changeRole('+u.id+',this.value)" class="px-2 py-1 border border-gray-300 rounded text-sm">'+ROLES.map(r=>'<option value="'+r.k+'" '+(u.role===r.k?'selected':'')+'>'+r.l+'</option>').join('')+'</select></td></tr>').join('');
  c.innerHTML='<div class="p-6"><div class="mb-6"><h2 class="text-xl font-bold text-gray-800">角色分配</h2><p class="text-sm text-gray-500 mt-1">为系统用户分配角色</p></div><div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">'+cards+'</div><div class="bg-white rounded-xl shadow-sm overflow-hidden"><table class="w-full text-sm"><thead class="bg-gray-50 border-b border-gray-200"><tr><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">用户名</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">姓名</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">当前角色</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">修改角色</th></tr></thead><tbody class="divide-y divide-gray-100">'+rows+'</tbody></table></div></div>';
}
window.changeRole=async function(uid,newRole){const u=await dbGet(S.USERS,uid);u.role=newRole;await dbPut(S.USERS,u);toast('角色已更新','success');renderModule('roles');};

/* ========== 模块14: 权限设置 ========== */
async function renderPermissions(c){
  if(cu.role!=='admin'){c.innerHTML='<div class="p-8 text-center text-gray-400">仅管理员可访问</div>';return;}
  const PMODS=MODS.filter(m=>m.k!=='settings').concat([{k:'settings',l:'系统设置'}]);
  const scorerPerms=['seats','scorers','assistants','scores','other_scores','summary','birthday','new_count','statistics','evaluation','persons'];
  const viewerPerms=['summary','statistics','evaluation'];
  let rows=PMODS.map(m=>{
    const inScorer=scorerPerms.includes(m.k);
    const inViewer=viewerPerms.includes(m.k);
    return'<tr class="hover:bg-gray-50"><td class="px-4 py-3 text-sm text-gray-700 font-medium">'+m.l+'</td><td class="px-4 py-3 text-center"><span class="badge bg-green-100 text-green-700">允许</span></td><td class="px-4 py-3 text-center">'+(inScorer?'<span class="badge bg-green-100 text-green-700">允许</span>':'<span class="badge bg-red-100 text-red-700">禁止</span>')+'</td><td class="px-4 py-3 text-center">'+(inViewer?'<span class="badge bg-green-100 text-green-700">允许</span>':'<span class="badge bg-red-100 text-red-700">禁止</span>')+'</td></tr>';
  }).join('');
  c.innerHTML='<div class="p-6"><div class="mb-6"><h2 class="text-xl font-bold text-gray-800">权限设置</h2><p class="text-sm text-gray-500 mt-1">各角色模块访问权限</p></div><div class="bg-white rounded-xl shadow-sm overflow-x-auto"><table class="w-full text-sm"><thead class="bg-gray-50 border-b border-gray-200"><tr><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">模块</th>'+ROLES.map(r=>'<th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">'+r.l+'</th>').join('')+'</tr></thead><tbody class="divide-y divide-gray-100">'+rows+'</tbody></table></div><div class="mt-4 p-4 bg-blue-50 rounded-lg text-sm text-blue-700"><p><strong>权限说明：</strong></p><p>系统管理员：全部模块完整访问</p><p>打分员：方位图、打分员信息、助教信息表、课间打分表、其他加分、汇总分、生日表、新人数、统计报表、评优、人员管理</p><p>查看者：仅汇总分、统计报表、评优（只读）</p></div></div>';
}

/* ========== 模块15: 系统设置 ========== */
async function renderSettings(c){
  c.innerHTML='<div class="p-6"><div class="mb-6"><h2 class="text-xl font-bold text-gray-800">系统设置</h2><p class="text-sm text-gray-500 mt-1">数据存储与系统管理</p></div><div class="bg-white rounded-xl shadow-sm p-6 mb-6"><h3 class="text-lg font-semibold text-gray-800 mb-4">云数据库状态</h3><div class="space-y-2 text-sm text-gray-600"><p><strong>存储引擎：</strong>GitHub 云数据库</p><p><strong>仓库地址：</strong>'+GH.owner+'/'+GH.repo+'</p><p><strong>数据文件：</strong>'+GH.path+'</p><p><strong>同步方式：</strong>自动同步（修改后2秒自动保存到云端）</p><p><strong>多设备同步：</strong>支持，所有设备共享同一份数据</p></div><div class="mt-4"><button id="syncBtn" class="bg-emerald-500 text-white px-4 py-2 rounded-lg hover:bg-emerald-600">手动刷新云端数据</button></div></div><div class="bg-white rounded-xl shadow-sm p-6 mb-6"><h3 class="text-lg font-semibold text-gray-800 mb-4">数据导入/导出</h3><div class="flex gap-3"><button id="exportBtn" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">导出全部数据</button><label class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 cursor-pointer">导入数据<input type="file" id="importBtn" accept=".json" class="hidden"/></label></div></div><div class="bg-white rounded-xl shadow-sm p-6"><h3 class="text-lg font-semibold text-gray-800 mb-4">系统信息</h3><div class="space-y-2 text-sm text-gray-600"><p><strong>系统名称：</strong>全民营养大健康论坛打分系统</p><p><strong>版本：</strong>3.0.0 云数据库版</p><p><strong>访问网址：</strong>https://wq247954368.github.io/scoring-system/</p><p><strong>当前用户：</strong>'+cu.name+'（'+(ROLES.find(r=>r.k===cu.role)?.l)+'）</p></div><div class="mt-4 pt-4 border-t border-gray-100"><button id="clearBtn" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">清空所有数据</button></div></div></div>';
  $('#syncBtn').addEventListener('click',async()=>{toast('正在刷新...','info');await openDB();toast('数据已刷新','success');renderModule(curMod);});
  $('#exportBtn').addEventListener('click',async()=>{const data={};for(const[n,s]of Object.entries(S)){data[n]=await dbAll(s);}const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='打分系统备份_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);toast('数据已导出','success');});
  $('#importBtn').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;if(!await confirmDlg('导入将覆盖现有数据，确定？'))return;try{const t=await f.text();const d=JSON.parse(t);for(const[n,s]of Object.entries(S)){if(d[n]&&Array.isArray(d[n])){await dbClear(s);for(const item of d[n]){delete item.id;await dbAdd(s,item);}}}await saveToGitHub();toast('导入成功','success');renderModule('settings');}catch(err){toast('导入失败：'+err.message,'error');}});
  $('#clearBtn').addEventListener('click',async()=>{if(!await confirmDlg('警告：将清空所有数据（账号除外），不可逆！确定？'))return;if(!await confirmDlg('再次确认：真的要清空？'))return;for(const[n,s]of Object.entries(S)){if(s!==S.USERS)await dbClear(s);}await saveToGitHub();toast('数据已清空','success');renderModule('settings');});
}

/* ========== 初始化 ========== */
(async function(){
  document.getElementById('app').innerHTML='<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-emerald-600 to-teal-700"><div class="text-center text-white"><div class="w-16 h-16 border-4 border-white border-t-transparent rounded-full animate-spin mx-auto mb-4"></div><p class="text-lg font-medium">正在连接云数据库...</p><p class="text-sm text-emerald-200 mt-2">全民营养大健康论坛打分系统</p></div></div>';
  try{
    await openDB();
    await initAdmin();
    renderApp();
    if(location.hash){
      const k=location.hash.slice(1);
      if(MODS.find(m=>m.k===k)){curMod=k;if(chkLogin())renderApp();}
    }
  }catch(err){
    console.error('初始化失败:',err);
    document.body.innerHTML='<div class="p-8 text-center text-red-500">系统初始化失败: '+err.message+'<br><button onclick="location.reload()" class="mt-4 px-4 py-2 bg-emerald-500 text-white rounded">重试</button></div>';
  }
})();
</script>
